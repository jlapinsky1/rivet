[build]
  command = "npm run build"
  publish = "dist"

# Old Squatterz URLs → /b/squatterz prefix
[[redirects]]
  from = "/commercial"
  to = "/b/squatterz"
  status = 301

[[redirects]]
  from = "/commercial/"
  to = "/b/squatterz"
  status = 301

[[redirects]]
  from = "/commercial/:subpage"
  to = "/b/squatterz/:subpage"
  status = 301

[[redirects]]
  from = "/book"
  to = "/b/squatterz"
  status = 301

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Private routes — noindex so crawlers don't index authenticated content.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dispatch/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
